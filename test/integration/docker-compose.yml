# Topology for the minitail integration tests.
#
#   client ──[ts]── minitail ──[transit]── router ── 192.0.2.40, 192.0.2.53
#              │                                      (on its loopback)
#          headscale
#
#   ts       172.28.0.0/24    headscale .10, minitail .20, client .30
#   transit  198.51.100.0/24  minitail .20, router .2
#
# minitail advertises both 192.0.2.0/24 and 198.51.100.0/24 as subnet routes.
# The router answers on an address in each, which makes the pair a controlled
# comparison:
#
#   * 192.0.2.40 is reachable from the minitail node only because of a static
#     route in that node's own table, so reaching it proves traffic follows the
#     host routing table. `client` has no route to it whatsoever.
#   * 198.51.100.2 is the same host on a LAN the minitail node is directly
#     attached to. A subnet route serves it; an exit node would not, because
#     ipnlocal.shrinkDefaultRoute makes an exit node "guest wifi" rather than
#     LAN access. This is the case a container bridge falls into.
#
# 192.0.2.53 runs a DNS server, so queries to it travel through the subnet
# route over UDP/53 — the path a split-DNS setup depends on.
#
# 192.0.2.0/24 is TEST-NET-1 and 198.51.100.0/24 is TEST-NET-2; neither is a
# Docker network, which keeps Docker's own anti-spoofing rules out of the way.
name: minitail-it

services:
  headscale:
    image: ghcr.io/juanfont/headscale:${HEADSCALE_VERSION:-v0.27.1}
    command: serve
    volumes:
      - ./headscale.yaml:/etc/headscale/config.yaml:ro
      # A tailnet policy has to name the advertised subnets (and
      # autogroup:internet for exit nodes) before a client may send traffic
      # through the router; without it the router's own packet filter drops
      # the flow and replies with a TSMP rejection.
      - ./headscale-policy.json:/etc/headscale/policy.json:ro
      - headscale-data:/var/lib/headscale
      - headscale-run:/var/run/headscale
    networks:
      ts:
        ipv4_address: 172.28.0.10

  # An IP router that also hosts the destination and the DNS server. It reuses
  # the node image because that is where busybox-extras (httpd) and dnsmasq
  # are installed.
  router:
    build: &node_image
      context: ../..
      dockerfile: test/integration/Dockerfile.node
      args:
        TS_VERSION: ${TS_VERSION:-1.102.4}
    entrypoint: ["/usr/local/bin/router-entrypoint.sh"]
    cap_add:
      - NET_ADMIN
    networks:
      transit:
        ipv4_address: 198.51.100.2

  minitail:
    build: *node_image
    entrypoint: ["/usr/local/bin/minitail-entrypoint.sh"]
    environment:
      # Everything else about this node, including which routes it advertises
      # and which control server it uses, comes from the config file the
      # entrypoint writes into this directory.
      MINITAIL_DIR: /var/lib/minitail
      # The suite is hermetic: tailscaled must not try to reach Tailscale's
      # own logging service.
      TS_NO_LOGS_NO_SUPPORT: "true"
      # Headscale's embedded DERP is served over plain HTTP here, which a
      # client would otherwise refuse to speak to.
      TS_DEBUG_USE_DERP_HTTP: "1"
    # Deliberately no cap_add and no /dev/net/tun: userspace networking mode
    # needs neither, and the absence of both is part of what is under test.
    # The static route this container needs is injected from outside, into its
    # network namespace, so that it stays unprivileged.
    networks:
      ts:
        ipv4_address: 172.28.0.20
      transit:
        ipv4_address: 198.51.100.20
    depends_on:
      - headscale
      - router

  client:
    build: *node_image
    entrypoint: ["/usr/local/bin/client-entrypoint.sh"]
    environment:
      TS_NO_LOGS_NO_SUPPORT: "true"
      TS_DEBUG_USE_DERP_HTTP: "1"
    # An ordinary kernel-mode Tailscale node, which does need these.
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    networks:
      ts:
        ipv4_address: 172.28.0.30
    depends_on:
      - headscale

networks:
  ts:
    ipam:
      config:
        - subnet: 172.28.0.0/24
  transit:
    ipam:
      config:
        - subnet: 198.51.100.0/24

volumes:
  headscale-data:
  headscale-run:
