# A minimal Headscale for hermetic integration tests: embedded DERP, no
# MagicDNS, no outbound network access.
---
server_url: http://headscale:8080
listen_addr: 0.0.0.0:8080
metrics_listen_addr: 0.0.0.0:9090
grpc_listen_addr: 0.0.0.0:50443
grpc_allow_insecure: false

noise:
  private_key_path: /var/lib/headscale/noise_private.key

prefixes:
  v4: 100.64.0.0/10
  v6: fd7a:115c:a1e0::/48
  allocation: sequential

# Headscale refuses to start with an empty DERP map, and an upstream map would
# mean reaching the internet, which this suite must not do. So the embedded
# DERP server is used. It is served over plain HTTP because server_url is
# http://, which normal clients will not accept; the nodes therefore run with
# TS_DEBUG_USE_DERP_HTTP=1 (see docker-compose.yml).
derp:
  server:
    enabled: true
    region_id: 999
    region_code: headscale
    region_name: Headscale Embedded DERP
    # verify_clients needs a tailscaled alongside Headscale, which this rig
    # does not have.
    verify_clients: false
    stun_listen_addr: 0.0.0.0:3478
    private_key_path: /var/lib/headscale/derp_server_private.key
    automatically_add_embedded_derp_region: true
    ipv4: 172.28.0.10
  urls: []
  paths: []
  auto_update_enabled: false
  update_frequency: 24h

disable_check_updates: true
ephemeral_node_inactivity_timeout: 30m

database:
  type: sqlite
  sqlite:
    path: /var/lib/headscale/db.sqlite
    write_ahead_log: true

log:
  level: info
  format: text

policy:
  mode: file
  path: /etc/headscale/policy.json

# DNS is explicitly out of scope for minitail, so MagicDNS stays off and the
# test asserts reachability at the IP level only.
dns:
  magic_dns: false
  base_domain: minitail.test
  override_local_dns: false
  nameservers:
    global: []
  search_domains: []
  extra_records: []

unix_socket: /var/run/headscale/headscale.sock
unix_socket_permission: "0770"

logtail:
  enabled: false
randomize_client_port: false
