name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to publish, e.g. v0.1.0 (created at the default branch if it does not exist)
        required: true

permissions:
  contents: write

jobs:
  release:
    name: Publish release and bump the formula
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Resolve the tag
        id: tag
        run: echo "name=${{ github.event.inputs.tag || github.ref_name }}" >> "$GITHUB_OUTPUT"

      # On a tag push the tag already exists; when dispatched by hand,
      # `gh release create` creates it at the checked-out commit.
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ steps.tag.outputs.name }}"
          gh release view "$tag" >/dev/null 2>&1 ||
            gh release create "$tag" --title "$tag" --generate-notes --target "$GITHUB_SHA"

      # The formula builds from the tag's source tarball, so the only thing
      # that has to change on a release is the URL and its checksum.
      - name: Point the formula at the new tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${{ steps.tag.outputs.name }}"
          url="https://github.com/${{ github.repository }}/archive/refs/tags/${tag}.tar.gz"
          curl -fsSL "$url" -o /tmp/src.tar.gz
          sha="$(sha256sum /tmp/src.tar.gz | cut -d' ' -f1)"
          echo "$tag -> $sha"

          default_branch="$(gh repo view --json defaultBranchRef -q .defaultBranchRef.name)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin "$default_branch"
          git checkout "$default_branch"

          python3 .github/scripts/bump-formula.py "$url" "$sha"
          if git diff --quiet -- Formula/minitail.rb; then
            echo "formula already up to date"
            exit 0
          fi
          git add Formula/minitail.rb
          # [skip ci]: the bump only rewrites two lines of the formula, which
          # the release's own run already validated.
          git commit -m "Point the Homebrew formula at ${tag} [skip ci]"
          git push origin "$default_branch"
